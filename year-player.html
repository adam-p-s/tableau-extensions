<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Year Player</title>
<script src="https://cdn.jsdelivr.net/npm/@tableau/extensions-api@latest/lib/tableau.extensions.1.latest.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6f2}
#msg{font-size:12px;color:#888;padding:8px;text-align:center}
#ui{display:none;flex-direction:column;align-items:center;gap:6px;width:100%;padding:6px 10px}
.row{display:flex;align-items:center;gap:6px;width:100%}
.year{font-size:22px;font-weight:700;color:#1a1a2e;min-width:52px;text-align:center;letter-spacing:1px}
button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;
  color:#555;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
button:hover{background:#e0e0e0;color:#111}
button:disabled{opacity:.25;cursor:default}
button:disabled:hover{background:none}
#btn-play{background:#01696f;color:#fff;border-radius:50%;width:40px;height:40px;flex-shrink:0}
#btn-play:hover{background:#0c4e54}
.sep{width:1px;height:22px;background:#ddd;flex-shrink:0}
.speed-row{display:flex;align-items:center;gap:5px;font-size:11px;color:#999}
select{font-size:11px;border:1px solid #ccc;border-radius:4px;padding:2px 4px;
  background:#fff;color:#444;cursor:pointer}
.range-wrap{display:flex;align-items:center;gap:4px;width:100%}
input[type=range]{flex:1;accent-color:#01696f;height:4px}
.range-label{font-size:10px;color:#aaa;min-width:28px;text-align:center}
</style>
</head>
<body>
<div id="msg">Connecting to Tableau…</div>
<div id="ui">
  <div class="row" style="justify-content:center">
    <button id="btn-first" title="First (2005)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button id="btn-prev" title="Previous year">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
    </button>
    <button id="btn-play" title="Play / Pause">
      <svg id="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button id="btn-next" title="Next year">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <button id="btn-last" title="Last (2025)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
    </button>
    <div class="sep"></div>
    <span class="year" id="year-display">—</span>
    <div class="sep"></div>
    <div class="speed-row">
      <span>Speed:</span>
      <select id="speed">
        <option value="2000">Slow</option>
        <option value="1000" selected>Normal</option>
        <option value="500">Fast</option>
        <option value="250">Very fast</option>
      </select>
    </div>
  </div>
  <div class="range-wrap">
    <span class="range-label">2005</span>
    <input type="range" id="scrubber" min="2005" max="2025" step="1" value="2005">
    <span class="range-label">2025</span>
  </div>
</div>
<script>
const MIN=2005,MAX=2025;
const PARAM='Selected Year'; // must match your parameter name exactly (case-sensitive)
let param=null,playing=false,timer=null,cur=MIN;
const msg=document.getElementById('msg'),ui=document.getElementById('ui');
const elYear=document.getElementById('year-display'),scrubber=document.getElementById('scrubber');
const btnPlay=document.getElementById('btn-play'),btnPrev=document.getElementById('btn-prev');
const btnNext=document.getElementById('btn-next'),btnFirst=document.getElementById('btn-first');
const btnLast=document.getElementById('btn-last');
const icPlay=document.getElementById('ic-play'),icPause=document.getElementById('ic-pause');
const speedSel=document.getElementById('speed');
function updateUI(y){cur=y;elYear.textContent=y;scrubber.value=y;
  btnFirst.disabled=btnPrev.disabled=(y<=MIN);btnNext.disabled=btnLast.disabled=(y>=MAX);}
function setPlaying(v){playing=v;icPlay.style.display=v?'none':'block';icPause.style.display=v?'block':'none';}
async function goTo(y){y=Math.max(MIN,Math.min(MAX,y));if(!param)return;
  try{await param.changeValueAsync(y);updateUI(y);}catch(e){msg.textContent='Error: '+e.message;}}
function tick(){if(cur>=MAX){stopPlay();return;}goTo(cur+1);}
function startPlay(){setPlaying(true);timer=setInterval(tick,+speedSel.value);}
function stopPlay(){clearInterval(timer);setPlaying(false);}
btnPlay.addEventListener('click',()=>playing?stopPlay():startPlay());
btnPrev.addEventListener('click',()=>{stopPlay();goTo(cur-1);});
btnNext.addEventListener('click',()=>{stopPlay();goTo(cur+1);});
btnFirst.addEventListener('click',()=>{stopPlay();goTo(MIN);});
btnLast.addEventListener('click',()=>{stopPlay();goTo(MAX);});
speedSel.addEventListener('change',()=>{if(playing){stopPlay();startPlay();}});
scrubber.addEventListener('input',()=>{stopPlay();goTo(+scrubber.value);});
tableau.extensions.initializeAsync().then(async()=>{
  const dash=tableau.extensions.dashboardContent.dashboard;
  param=await dash.findParameterAsync(PARAM);
  if(!param){msg.textContent='Parameter "'+PARAM+'" not found. Check the name is exact (case-sensitive).';return;}
  updateUI(parseInt(param.currentValue.value)||MIN);
  param.addEventListener(tableau.TableauEventType.ParameterChanged,async(e)=>{
    const p=await e.getParameterAsync();const v=parseInt(p.currentValue.value);if(v!==cur)updateUI(v);});
  msg.style.display='none';ui.style.display='flex';
}).catch(e=>{msg.textContent='Cannot connect to Tableau: '+String(e);});
</script>
</body>
</html>
