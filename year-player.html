<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Year Player</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Tableau Book','Tableau','Segoe UI',sans-serif;background:transparent}
#msg{font-size:11px;color:#000;padding:6px;text-align:center;font-family:inherit}
#ui{display:none;flex-direction:column;align-items:center;gap:4px;width:100%;padding:4px 10px}
.row{display:flex;align-items:center;gap:5px;width:100%;justify-content:center}
button{background:none;border:none;cursor:pointer;padding:3px;border-radius:3px;
  color:#1862a8;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
button:hover{background:#e4edf7;color:#0f4a80}
button:disabled{opacity:.25;cursor:default}
button:disabled:hover{background:none}
#btn-play{background:#1862a8;color:#fff;border-radius:50%;width:28px;height:28px;flex-shrink:0}
#btn-play:hover{background:#0f4a80}
.sep{width:1px;height:18px;background:#1862a8;opacity:0.4;flex-shrink:0}
.speed-row{display:flex;align-items:center;gap:4px;font-size:10px;color:#000;font-family:inherit}
select{font-size:11px;border:1px solid #ccc;border-radius:3px;padding:1px 4px;
  background:#fff;color:#000;cursor:pointer;font-family:inherit}
#year-select{font-size:11px;font-weight:700;border:1px solid #ccc;border-radius:3px;
  padding:1px 4px;background:#fff;color:#000;cursor:pointer;font-family:inherit;min-width:54px}
.range-wrap{display:flex;align-items:center;gap:4px;width:100%;padding:0 4px}
input[type=range]{flex:1;accent-color:#1862a8;height:3px}
.range-label{font-size:9px;color:#000;min-width:26px;text-align:center;font-family:inherit}
</style>
</head>
<body>
<div id="msg">Connecting to Tableau&hellip;</div>
<div id="ui">
  <div class="row">
    <button id="btn-first" title="First (2005)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button id="btn-prev" title="Previous year">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
    </button>
    <button id="btn-play" title="Play / Pause">
      <svg id="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button id="btn-next" title="Next year">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <button id="btn-last" title="Last (2025)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
    </button>
    <div class="sep"></div>
    <select id="year-select" title="Select year"></select>
    <div class="sep"></div>
    <div class="speed-row">
      <span>Speed:</span>
      <select id="speed">
        <option value="4000">Slow</option>
        <option value="2000" selected>Normal</option>
        <option value="1000">Fast</option>
      </select>
    </div>
  </div>
  <div class="range-wrap">
    <span class="range-label">2005</span>
    <input type="range" id="scrubber" min="2005" max="2025" step="1" value="2005">
    <span class="range-label">2025</span>
  </div>
</div>
<script>
const MIN=2005, MAX=2025;
const PARAM='Selected Year';
let param=null, playing=false, timer=null, cur=MIN;
let allowedYears=null;

const msg=document.getElementById('msg'), ui=document.getElementById('ui');
const scrubber=document.getElementById('scrubber');
const yearSelect=document.getElementById('year-select');
const btnPlay=document.getElementById('btn-play'), btnPrev=document.getElementById('btn-prev');
const btnNext=document.getElementById('btn-next'), btnFirst=document.getElementById('btn-first');
const btnLast=document.getElementById('btn-last');
const icPlay=document.getElementById('ic-play'), icPause=document.getElementById('ic-pause');
const speedSel=document.getElementById('speed');

function isAllowed(y){ return !allowedYears || allowedYears.has(y); }
function nearestAllowed(from, dir){
  let y=from;
  while(y>=MIN && y<=MAX){ if(isAllowed(y)) return y; y+=dir; }
  return null;
}
function buildDropdown(){
  yearSelect.innerHTML='';
  for(let y=MIN;y<=MAX;y++){
    if(!allowedYears || allowedYears.has(y)){
      const opt=document.createElement('option');
      opt.value=y; opt.textContent=y;
      yearSelect.appendChild(opt);
    }
  }
}
function updateUI(y){
  cur=y;
  scrubber.value=y;
  yearSelect.value=y;
  btnFirst.disabled=btnPrev.disabled=(nearestAllowed(y-1,-1)===null);
  btnNext.disabled=btnLast.disabled=(nearestAllowed(y+1,1)===null);
}
function setPlaying(v){
  playing=v;
  icPlay.style.display=v?'none':'block';
  icPause.style.display=v?'block':'none';
}
async function goTo(y){
  y=Math.max(MIN,Math.min(MAX,y));
  if(!param) return;
  if(!isAllowed(y)){
    if(playing){ const n=nearestAllowed(y+1,1); if(n!==null) goTo(n); else stopPlay(); }
    return;
  }
  try{ await param.changeValueAsync(parseInt(y,10)); updateUI(y); }
  catch(e){ stopPlay(); msg.textContent='Error: '+e.message; msg.style.display='block'; }
}
function tick(){ if(cur>=MAX){ stopPlay(); return; } goTo(cur+1); }
function startPlay(){ msg.style.display='none'; setPlaying(true); timer=setInterval(tick,+speedSel.value); }
function stopPlay(){ clearInterval(timer); setPlaying(false); }

btnPlay.addEventListener('click',()=>playing?stopPlay():startPlay());
btnPrev.addEventListener('click',()=>{ stopPlay(); const y=nearestAllowed(cur-1,-1); if(y!==null) goTo(y); });
btnNext.addEventListener('click',()=>{ stopPlay(); const y=nearestAllowed(cur+1,1); if(y!==null) goTo(y); });
btnFirst.addEventListener('click',()=>{ stopPlay(); const y=nearestAllowed(MIN,1); if(y!==null) goTo(y); });
btnLast.addEventListener('click',()=>{ stopPlay(); const y=nearestAllowed(MAX,-1); if(y!==null) goTo(y); });
speedSel.addEventListener('change',()=>{ if(playing){ stopPlay(); startPlay(); } });
scrubber.addEventListener('input',()=>{ stopPlay(); const y=nearestAllowed(+scrubber.value,1)||nearestAllowed(+scrubber.value,-1); if(y!==null) goTo(y); });
yearSelect.addEventListener('change',()=>{ stopPlay(); goTo(+yearSelect.value); });

if(typeof tableau==='undefined'){
  msg.textContent='Extensions API library failed to load.';
} else {
  tableau.extensions.initializeAsync().then(async()=>{
    const dash=tableau.extensions.dashboardContent.dashboard;
    param=await dash.findParameterAsync(PARAM);
    if(!param){ msg.textContent='Parameter "'+PARAM+'" not found. Check name is exact (case-sensitive).'; return; }
    const domain=param.allowableValues;
    if(domain.type==='list'){
      allowedYears=new Set(domain.allowableValues.map(dv=>parseInt(dv.value)));
    }
    buildDropdown();
    updateUI(parseInt(param.currentValue.value)||MIN);
    param.addEventListener(tableau.TableauEventType.ParameterChanged,async(e)=>{
      const p=await e.getParameterAsync();
      const v=parseInt(p.currentValue.value);
      if(v!==cur) updateUI(v);
    });
    msg.style.display='none'; ui.style.display='flex';
  }).catch(e=>{ msg.textContent='Init failed: '+String(e); });
}
</script>
</body>
</html>
